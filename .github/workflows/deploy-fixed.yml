name: 🚀 Deploy Fixed

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p 5655 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: 📦 Deploy Files
      run: |
        echo "Deploying files..."
        rsync -avz \
          --exclude='.env' \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='reports/preciosChanged.csv' \
          -e "ssh -i ~/.ssh/deploy_key -p 5655" \
          ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/
        echo "Deployment completed"

    - name: 🔧 Setup Reports
      run: |
        ssh -i ~/.ssh/deploy_key -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          mkdir -p /var/www/html/reports/
          cp /ketcore/log/preciosChanged.csv /var/www/html/reports/preciosChanged.csv
          chown www-data:www-data /var/www/html/reports/preciosChanged.csv
        "
