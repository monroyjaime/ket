name: 🚀 Production Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p 5655 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: 📦 Deploy Application Files
      run: |
        echo "Deploying application files..."
        rsync -avz \
          --exclude='.env' \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='reports/' \  # ← Directorio manejado independientemente
          --exclude='*.sql' \
          --exclude='*.log' \
          --exclude='backup-*' \
          -e "ssh -i ~/.ssh/deploy_key -p 5655" \
          ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/
        echo "✅ Deployment completed successfully"

    - name: ✅ Verify Deployment
      run: |
        ssh -i ~/.ssh/deploy_key -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          echo '📁 Deployment verification:'
          ls -la /var/www/html/ | head -5
          echo ''
          echo '📊 Total PHP files deployed:'
          find /var/www/html/ -name '*.php' | wc -l
          echo '✅ Ket Electropartes deployment verified!'
        "