name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p 5655 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: 🚀 Deploy with backup safety
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "tar -czf /tmp/backup-$(date +%Y%m%d-%H%M%S).tar.gz /var/www/html/ 2>/dev/null || true"
        rsync -avz --delete --exclude='.env' --exclude='uploads/' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655" ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/
        echo "✅ Deployment with backup and controlled delete completed"

    - name: ✅ Verify deployment
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "ls -la /var/www/html/ && echo '✅ Ket deployment verified!'"