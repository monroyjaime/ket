name: 🚀 Deploy Ket Electropartes

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p 5655 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        echo "✅ SSH setup completed"

    - name: 📦 Deploy Files
      run: |
        echo "🚀 Starting deployment..."
        
        # Despliegue seguro SIN --delete y con exclusiones específicas
        rsync -avz \
          --exclude='.env' \
          --exclude='.env.*' \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='backup-*.tar.gz' \
          --exclude='*.sql' \
          --exclude='*.log' \
          --exclude='.gitkeep' \  # ← AÑADE ESTA LÍNEA
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655" \
          ./\
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/
        
        echo "✅ Deployment completed successfully"

    - name: 🔗 Recreate Symbolic Link for preciosChanged.csv
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          echo '🔗 Setting up symbolic link for preciosChanged.csv...'
          
          # Crear directorio de reports si no existe
          mkdir -p '/var/www/html/reports/'
          
          # Verificar si el archivo original existe
          if [ -f '/ketcore/log/preciosChanged.csv' ]; then
            # Recrear link simbólico (usar -f para forzar recreación)
            ln -sf '/ketcore/log/preciosChanged.csv' '/var/www/html/reports/preciosChanged.csv'
            echo '✅ Symbolic link created: /ketcore/log/preciosChanged.csv → /var/www/html/reports/preciosChanged.csv'
          else
            echo '⚠️  Archivo original no encontrado en /ketcore/log/preciosChanged.csv'
            echo '🔍 Probando ruta alternativa /home/jaime/ketcore/log/preciosChanged.csv...'
            if [ -f '/home/jaime/ketcore/log/preciosChanged.csv' ]; then
              ln -sf '/home/jaime/ketcore/log/preciosChanged.csv' '/var/www/html/reports/preciosChanged.csv'
              echo '✅ Symbolic link created con ruta alternativa'
            else
              echo '❌ Archivo original no encontrado en ninguna ruta conocida'
            fi
          fi
        "

    - name: ✅ Verify Deployment
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          echo '📁 Deployment verification:'
          ls -la /var/www/html/ | head -5
          echo ''
          echo '🔗 Symbolic link verification:'
          ls -la '/var/www/html/reports/preciosChanged.csv'
          echo ''
          echo '📊 File type check:'
          file '/var/www/html/reports/preciosChanged.csv'
          echo ''
          echo '🖼️ Image files count:'
          find /var/www/html/ -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' | wc -l
          echo '📊 Total PHP files:'
          find /var/www/html/ -name '*.php' | wc -l
          echo ''
          echo '✅ Ket Electropartes deployment verified!'
        "
