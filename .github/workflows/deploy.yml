name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p 5655 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: 🚀 Deploy with backup safety
      run: |
        # Verificar espacio en disco primero
        ssh -i ~/.ssh/deploy_key -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "df -h /tmp && df -h /var/www/"
        
        # Crear backup con timestamp (excluyendo uploads para ahorrar espacio
        BACKUP_FILE="/tmp/backup-ket-$(date +%Y%m%d-%H%M%S).tar.gz"
        echo "📦 Creating backup: $BACKUP_FILE"
        ssh -i ~/.ssh/deploy_key -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          cd /var/www/html/ && \
          tar -czf $BACKUP_FILE . \
            --exclude='./uploads' \
            --exclude='./backup-*.tar.gz' \
            --exclude='./node_modules' \
            --exclude='./.git' \
          2>/dev/null || echo '⚠️  Backup completed with warnings'
        "
        
        # Despliegue seguro SIN --delete, incluyendo imágenes
        echo "🚀 Deploying application with images..."
        rsync -avz \
          --exclude='.env' \
          --exclude='.env.*' \
          --exclude='backup-*.tar.gz' \
          --exclude='node_modules/' \
          --exclude='.git/' \
          --exclude='*.sql' \
          --exclude='*.log' \
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 5655" \
          ./ \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/
        
        echo "✅ Deployment with images completed successfully"

    - name: ✅ Verify deployment
      run: |
        ssh -i ~/.ssh/deploy_key -p 5655 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          echo '📁 Checking deployment:'
          ls -la /var/www/html/ | head -10
          echo '🖼️  Image files count:'
          find /var/www/html/ -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' | wc -l
          echo '📊 Total files:'
          find /var/www/html/ -type f | wc -l
          echo '✅ Ket catalog deployment verified!'
        "